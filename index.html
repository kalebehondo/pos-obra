    function Icon({ name, className = 'w-4 h-4' }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current || !window.lucide) return;
        const pascalName = name
          .split('-')
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join('');
        const iconDef = window.lucide.icons?.[pascalName];
        if (!iconDef) return;

        const svgEl = window.lucide.createElement(iconDef);
        svgEl.setAttribute('class', className);
        containerRef.current.innerHTML = '';
        containerRef.current.appendChild(svgEl);
      }, [name, className]);

      return <span ref={containerRef} className="inline-flex items-center justify-center flex-shrink-0" />;

    const normalizeUrl = (url) => {
      if (!url) return '';
      const trimmed = String(url).trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return `https://${trimmed}`;
    };

      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

      }, [empreendimentosData]);

      const gerarProximoProtocolo = () => {
        const year = new Date().getFullYear();
        let maxNum = 0;
        chamados.forEach((c) => {
          const match = c.protocolo?.match(/OS-\d{4}-(\d+)/);
          if (match) {
            const num = parseInt(match[1], 10);
            if (num > maxNum) maxNum = num;
          }
        });
        return `OS-${year}-${String(maxNum + 1).padStart(3, '0')}`;
      };

      const kpis = useMemo(() => {
        const total = chamados.length;
        const abertosVistoria = chamados.filter(
          (c) => c.status === 'Aberto' || c.status === 'Vistoria Agendada'
        ).length;
        const emExecucao = chamados.filter(
          (c) => c.status === 'Em Execução' || c.status === 'Aguardando Material'
        ).length;
        const concluidos = chamados.filter((c) => c.status === 'Concluído').length;
        const improcedentes = chamados.filter(
          (c) =>
            c.status === 'Improcedente / Encerrado' ||
            c.enquadramento?.startsWith('Improcedente') ||
            c.enquadramento?.includes('Condomínio')
        ).length;

        return { total, abertosVistoria, emExecucao, concluidos, improcedentes };
      }, [chamados]);

      const filteredChamados = useMemo(() => {
        return chamados.filter((c) => {
          const matchSearch =
            !searchTerm ||
            c.protocolo?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.empreendimento?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.unidade?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.solicitante?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (c.email && c.email.toLowerCase().includes(searchTerm.toLowerCase())) ||
            c.descricaoSolicitacao?.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (c.tecnico && c.tecnico.toLowerCase().includes(searchTerm.toLowerCase()));

          const matchEmp =
            filterEmpreendimento === 'Todos' || c.empreendimento === filterEmpreendimento;
          const matchStatus = filterStatus === 'Todos' || c.status === filterStatus;
          const matchEnq =
            filterEnquadramento === 'Todos' ||
            (filterEnquadramento === 'Procedente' && c.enquadramento?.startsWith('Procedente')) ||
            (filterEnquadramento === 'Improcedente' && c.enquadramento?.startsWith('Improcedente')) ||
            (filterEnquadramento === 'Condomínio' && c.enquadramento?.includes('Condomínio'));

          return matchSearch && matchEmp && matchStatus && matchEnq;
        });
      }, [chamados, searchTerm, filterEmpreendimento, filterStatus, filterEnquadramento]);

      const relatorioChamados = useMemo(() => {
        return chamados.filter((c) => {
          const matchEmp = repEmpreendimento === 'Todos' || c.empreendimento === repEmpreendimento;
          const matchStatus = repStatus === 'Todos' || c.status === repStatus;
          const matchEnq = repEnquadramento === 'Todos' || c.enquadramento === repEnquadramento;
          const matchInicio = !repDataInicio || c.dataAbertura >= repDataInicio;
          const matchFim = !repDataFim || c.dataAbertura <= repDataFim;
          return matchEmp && matchStatus && matchEnq && matchInicio && matchFim;
        });
      }, [chamados, repEmpreendimento, repStatus, repEnquadramento, repDataInicio, repDataFim]);

      const relatorioStats = useMemo(() => {
        const total = relatorioChamados.length;
        const byStatus = {};
        STATUS_OPCOES.forEach((s) => (byStatus[s] = 0));

        const byEnqResumo = {
          'Garantia Construtora (Procedente)': 0,
          'Improcedente (Reforma / Prazo)': 0,
          'Manutenção Condomínio': 0

        const byCategoria = {};
        CATEGORIAS_TECNICAS.forEach((cat) => (byCategoria[cat] = 0));

        relatorioChamados.forEach((c) => {
          byStatus[c.status] = (byStatus[c.status] || 0) + 1;
          byCategoria[c.categoria] = (byCategoria[c.categoria] || 0) + 1;

          if (c.enquadramento?.startsWith('Procedente')) {
            byEnqResumo['Garantia Construtora (Procedente)'] += 1;
          } else if (c.enquadramento?.includes('Condomínio')) {
            byEnqResumo['Manutenção Condomínio'] += 1;
          } else {
            byEnqResumo['Improcedente (Reforma / Prazo)'] += 1;

        return { total, byStatus, byEnqResumo, byCategoria };

      // Ações CRUD Supabase
      const handleOpenNewModal = () => {

      const handleOpenEditModal = (chamado) => {

      const handleSaveChamado = async (formData) => {

          id: docId,
          linkFotos: normalizeUrl(formData.linkFotos),
          linkTermoRecebimento: normalizeUrl(formData.linkTermoRecebimento)

        const { error } = await supabaseClient
          .from('chamados')
          .upsert(normalizedData, { onConflict: 'id' });

        if (error) {
          console.error('Erro ao salvar no Supabase:', error);
          showToast(`Erro ao salvar: ${error.message}`);
          return;
        }

        setChamados((prev) => {
          const exists = prev.some((c) => c.id === docId);
          const updated = exists
            ? prev.map((c) => (c.id === docId ? normalizedData : c))
            : [normalizedData, ...prev];
          return sortChamadosList(updated);

        showToast(
          editingChamado

        setEditingChamado(null);

              linkTermoRecebimento: normalizeUrl(item.linkTermoRecebimento)

            console.error('Erro na importação JSON:', err);
            showToast('Erro ao importar arquivo JSON para o Supabase.');
          }

        reader.readAsText(file);
        e.target.value = '';

                    <div className="col-span-6 p-3 border-r border-slate-300">
                      <span className="text-[10px] uppercase font-bold text-slate-500 block">
                        Data e Horário da Vistoria Técnica
                      </span>
                      <span className="font-bold text-slate-900 mt-0.5 block">
                        {osPreviewChamado.dataVistoria
                          ? `${formatDateBR(osPreviewChamado.dataVistoria)}${
                              osPreviewChamado.horarioVistoria
                                ? ` às ${osPreviewChamado.horarioVistoria}`
                                : ''
                            }`
                          : '____/____/2026 • Horário: ____:____'}
                      </span>
                    </div>

                    <div className="col-span-6 p-3">
                      <span className="text-[10px] uppercase font-bold text-slate-500 block">
                        Data e Período Agendado para Execução
                      </span>
                      <span className="font-bold text-[#13293d] mt-0.5 block">
                        {osPreviewChamado.dataAgendamento
                          ? `${formatDateBR(osPreviewChamado.dataAgendamento)}${
                              osPreviewChamado.horarioAgendamento
                                ? ` (${osPreviewChamado.horarioAgendamento})`
                                : ''
                            }`
                          : osPreviewChamado.horarioAgendamento ||
                            '____/____/2026 • Período: ________________'}
                      </span>
                    </div>
                  </div>

                  <div className="grid grid-cols-12 text-xs bg-stone-50/80">
                    <div className="col-span-6 p-2.5 border-r border-slate-300">
                      <span className="text-[10px] uppercase font-bold text-slate-500 block">
                        Registro Presencial — Início do Atendimento
                      </span>
                      <span className="text-slate-700 mt-1 block">
                        Data: ____/____/2026 &nbsp;&nbsp;|&nbsp;&nbsp; Hora Entrada: ____:____
                      </span>
                    </div>

                    <div className="col-span-6 p-2.5">
                      <span className="text-[10px] uppercase font-bold text-slate-500 block">
                        Registro Presencial — Término do Atendimento
                      </span>
                      <span className="text-slate-700 mt-1 block">
                        Data: ____/____/2026 &nbsp;&nbsp;|&nbsp;&nbsp; Hora Saída: ____:____
                      </span>
                    </div>
                  </div>
                </div>

                <div className="mt-4 border border-slate-400 print-page-break-inside-avoid">
                  <div className="bg-slate-200 text-slate-900 px-3 py-1.5 text-xs font-bold uppercase tracking-wider border-b border-slate-400">
                    5. Termo de Recebimento e Assinaturas
                  </div>
                  <div className="p-4 space-y-6">
                    <p className="text-[11px] text-slate-600 leading-relaxed">
                      Declaramos que os serviços descritos nesta Ordem de Serviço foram devidamente vistoriados e/ou executados dentro dos padrões técnicos estabelecidos pela Casaalta Construções, encontrando-se o ambiente limpo e em perfeitas condições de uso.
                    </p>

                    <div className="grid grid-cols-3 gap-6 pt-6 text-center text-xs">
                      <div>
                        <div className="border-t border-slate-800 pt-1.5 font-semibold text-slate-900">
                          Engenharia Pós-Obra
                        </div>
                        <div className="text-[10px] text-slate-500">Casaalta Construções</div>
                      </div>

                      <div>
                        <div className="border-t border-slate-800 pt-1.5 font-semibold text-slate-900">
                          Técnico / Prestador Executor
                        </div>
                        <div className="text-[10px] text-slate-500">
                          {osPreviewChamado.tecnico || 'Assinatura do Executor'}
                        </div>
                      </div>

                      <div>
                        <div className="border-t border-slate-800 pt-1.5 font-semibold text-slate-900">
                          Proprietário / Síndico
                        </div>
                        <div className="text-[10px] text-slate-500">
                          Data: ____/____/2026 • Hora: ____:____
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAIS */}
          {isFormModalOpen && (
            <ChamadoFormModal
              initialData={editingChamado}
              nextProtocolo={gerarProximoProtocolo()}
              empreendimentosPermitidos={empreendimentosDisponiveis}
              empreendimentoByName={empreendimentoByName}
              allChamados={chamados}
              onOpenUnitHistory={(emp, unid) =>
                setUnitHistoryTarget({ empreendimento: emp, unidade: unid })
              }
              onClose={() => {
                setIsFormModalOpen(false);
                setEditingChamado(null);
              }}
              onSave={handleSaveChamado}
            />
          )}

          {editingEmpreendimento && (
            <EmpreendimentoEditModal
              empreendimento={editingEmpreendimento}
              onClose={() => setEditingEmpreendimento(null)}
              onSave={handleSaveEmpreendimento}
            />
          )}

          {unitHistoryTarget && (
            <UnitHistoryModal
              empreendimento={unitHistoryTarget.empreendimento}
              unidade={unitHistoryTarget.unidade}
              chamados={chamados}
              onClose={() => setUnitHistoryTarget(null)}
              onSelectOS={(chamado) => {
                setUnitHistoryTarget(null);
                setOsPreviewChamado(chamado);
              }}
              onEditChamado={(chamado) => {
                setUnitHistoryTarget(null);
                handleOpenEditModal(chamado);
              }}
            />
          )}

          {deleteConfirmChamado && (
            <div className="no-print fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-stone-200">
                <div className="flex items-center gap-3 text-rose-700 mb-3">
                  <div className="p-2.5 rounded-full bg-rose-100">
                    <Icon name="alert-triangle" className="w-5 h-5" />
                  </div>
                  <h3 className="text-lg font-bold text-slate-900">Excluir Chamado</h3>
                </div>
                <p className="text-sm text-slate-600 leading-relaxed">
                  Tem certeza que deseja excluir permanentemente o chamado{' '}
                  <strong className="text-slate-900">{deleteConfirmChamado.protocolo}</strong> (
                  {deleteConfirmChamado.empreendimento} - {deleteConfirmChamado.unidade})? Esta ação não poderá ser desfeita.
                </p>
                <div className="flex justify-end gap-2.5 mt-6">
                  <button
                    onClick={() => setDeleteConfirmChamado(null)}
                    className="px-4 py-2 rounded-lg border border-stone-300 text-slate-700 text-sm font-medium hover:bg-stone-50"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={handleDeleteChamado}
                    className="px-4 py-2 rounded-lg bg-rose-700 text-white text-sm font-medium hover:bg-rose-800"
                  >
                    Confirmar Exclusão
                  </button>
                </div>
              </div>
            </div>
          )}

          {restoreConfirmOpen && (
            <div className="no-print fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl border border-stone-200">
                <div className="flex items-center gap-3 text-amber-700 mb-3">
                  <div className="p-2.5 rounded-full bg-amber-100">
                    <Icon name="rotate-ccw" className="w-5 h-5" />
                  </div>
                  <h3 className="text-lg font-bold text-slate-900">Restaurar Dados de Exemplo</h3>
                </div>
                <p className="text-sm text-slate-600 leading-relaxed">
                  Isso substituirá os chamados atuais pelos chamados modelo dos 5 empreendimentos oficiais da{' '}
                  <strong>Casaalta Construções</strong>. Deseja continuar?
                </p>
                <div className="flex justify-end gap-2.5 mt-6">
                  <button
                    onClick={() => setRestoreConfirmOpen(false)}
                    className="px-4 py-2 rounded-lg border border-stone-300 text-slate-700 text-sm font-medium hover:bg-stone-50"
                  >
                    Cancelar
                  </button>
                  <button
                    onClick={handleRestoreDefaults}
                    className="px-4 py-2 rounded-lg bg-[#13293d] text-white text-sm font-medium hover:bg-[#1e3f5a]"
                  >
                    Restaurar Exemplos
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ========================================================================
    // MODAL DE CADASTRO E EDIÇÃO DE CHAMADO
    // ========================================================================
    function ChamadoFormModal({
      initialData,
      nextProtocolo,
      empreendimentosPermitidos,
      empreendimentoByName,
      allChamados,
      onOpenUnitHistory,
      onClose,
      onSave
    }) {
      const today = new Date().toISOString().slice(0, 10);

      const [formData, setFormData] = useState({
        protocolo: initialData?.protocolo || nextProtocolo,
        dataAbertura: initialData?.dataAbertura || today,
        dataPrevista: initialData?.dataPrevista || '',
        dataEntregaChaves: initialData?.dataEntregaChaves || '',
        linkTermoRecebimento: initialData?.linkTermoRecebimento || '',
        dataVistoria: initialData?.dataVistoria || '',
        horarioVistoria: initialData?.horarioVistoria || '',
        dataAgendamento: initialData?.dataAgendamento || '',
        horarioAgendamento: initialData?.horarioAgendamento || '',
        empreendimento:
          initialData?.empreendimento &&
          empreendimentosPermitidos.includes(initialData.empreendimento)
            ? initialData.empreendimento
            : empreendimentosPermitidos[0],
        unidade: initialData?.unidade || '',
        solicitante: initialData?.solicitante || '',
        telefone: initialData?.telefone || '',
        email: initialData?.email || '',
        categoria: initialData?.categoria || CATEGORIAS_TECNICAS[0],
        status: initialData?.status || 'Aberto',
        enquadramento: initialData?.enquadramento || ENQUADRAMENTOS_OPCOES[0],
        tecnico: initialData?.tecnico || '',
        linkFotos: initialData?.linkFotos || '',
        descricaoSolicitacao: initialData?.descricaoSolicitacao || '',
        parecerTecnico: initialData?.parecerTecnico || '',
        escopoExecucao: initialData?.escopoExecucao || ''
      });

      const [errorMsg, setErrorMsg] = useState('');

      const unitPreviousChamados = useMemo(() => {
        const unitTrimmed = formData.unidade.trim().toLowerCase();
        if (!unitTrimmed) return [];
        return allChamados
          .filter(
            (c) =>
              c.id !== initialData?.id &&
              c.empreendimento === formData.empreendimento &&
              c.unidade.trim().toLowerCase() === unitTrimmed
          )
          .sort((a, b) => (b.dataAbertura || '').localeCompare(a.dataAbertura || ''));
      }, [allChamados, formData.empreendimento, formData.unidade, initialData?.id]);

      useEffect(() => {
        if (initialData || unitPreviousChamados.length === 0) return;
        const latest = unitPreviousChamados[0];
        setFormData((prev) => ({
          ...prev,
          solicitante: prev.solicitante.trim() ? prev.solicitante : latest.solicitante || '',
          telefone: prev.telefone.trim() ? prev.telefone : latest.telefone || '',
          email: prev.email.trim() ? prev.email : latest.email || '',
          dataEntregaChaves: prev.dataEntregaChaves
            ? prev.dataEntregaChaves
            : latest.dataEntregaChaves || '',
          linkTermoRecebimento: prev.linkTermoRecebimento.trim()
            ? prev.linkTermoRecebimento
            : latest.linkTermoRecebimento || ''
        }));
      }, [unitPreviousChamados, initialData]);

      const handleChange = (field, value) => {
        setFormData((prev) => ({ ...prev, [field]: value }));
        if (errorMsg) setErrorMsg('');
      };

      const normalizedPhotoPreview = normalizeUrl(formData.linkFotos);
      const normalizedTermoPreview = normalizeUrl(formData.linkTermoRecebimento);
      const selectedEmpInfo = empreendimentoByName?.[formData.empreendimento];
      const selectedEmpDocsUrl = normalizeUrl(selectedEmpInfo?.linkDocumentos);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (
          !formData.empreendimento.trim() ||
          !formData.unidade.trim() ||
          !formData.solicitante.trim() ||
          !formData.descricaoSolicitacao.trim()
        ) {
          setErrorMsg(
            'Por favor, preencha os campos obrigatórios: Empreendimento, Unidade, Solicitante e Descrição da Solicitação.'
          );
          return;
        }
        onSave(formData);
      };

      return (
        <div className="no-print fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-4xl w-full shadow-2xl border border-stone-200 my-auto overflow-hidden flex flex-col max-h-[92vh]">
            <div className="bg-[#13293d] text-white px-6 py-4 flex items-center justify-between flex-shrink-0">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-widest text-[#e08b5b]">
                  Casaalta Construções • Engenharia de Pós-Obra
                </span>
                <h3 className="text-lg font-bold">
                  {initialData
                    ? `Editar Chamado & Parecer Técnico (${formData.protocolo})`
                    : `Novo Chamado de Pós-Obra (${formData.protocolo})`}
                </h3>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-lg text-stone-300 hover:bg-white/10 hover:text-white transition"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 overflow-y-auto space-y-5">
              {errorMsg && (
                <div className="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-lg text-xs font-medium flex items-center gap-2">
                  <Icon name="alert-triangle" className="w-4 h-4" />
                  <span>{errorMsg}</span>
                </div>
              )}

              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-stone-200 pb-1.5 mb-3">
                  1. Identificação do Empreendimento e Solicitante
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Protocolo / OS
                    </label>
                    <input
                      type="text"
                      value={formData.protocolo}
                      onChange={(e) => handleChange('protocolo', e.target.value)}
                      className="w-full px-3 py-2 text-sm font-mono font-bold bg-stone-100 border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Data de Abertura *
                    </label>
                    <input
                      type="date"
                      value={formData.dataAbertura}
                      onChange={(e) => handleChange('dataAbertura', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Previsão / Conclusão
                    </label>
                    <input
                      type="date"
                      value={formData.dataPrevista}
                      onChange={(e) => handleChange('dataPrevista', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Empreendimento *
                    </label>
                    <select
                      value={formData.empreendimento}
                      onChange={(e) => handleChange('empreendimento', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg font-medium"
                    >
                      {empreendimentosPermitidos.map((emp) => (
                        <option key={emp} value={emp}>
                          {emp}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Unidade / Local *
                    </label>
                    <input
                      type="text"
                      value={formData.unidade}
                      onChange={(e) => handleChange('unidade', e.target.value)}
                      placeholder="Ex: Torre A - Apto 645, Cobertura, Hall"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>
                </div>

                <div className="mt-4 bg-stone-50 rounded-lg p-3.5 border border-stone-200 grid grid-cols-1 sm:grid-cols-3 gap-3 items-center">
                  <div>
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-500 block">
                      Data do Habite-se (Empreendimento)
                    </span>
                    <span className="text-sm font-bold text-slate-900 mt-0.5 block">
                      {selectedEmpInfo?.dataHabiteSe
                        ? formatDateBR(selectedEmpInfo.dataHabiteSe)
                        : 'Não cadastrada'}
                    </span>
                  </div>

                  <div>
                    <span className="text-[11px] font-semibold uppercase tracking-wider text-slate-500 block">
                      Entrega do Condomínio
                    </span>
                    <span className="text-sm font-bold text-slate-900 mt-0.5 block">
                      {selectedEmpInfo?.dataEntregaCondominio
                        ? formatDateBR(selectedEmpInfo.dataEntregaCondominio)
                        : 'Não cadastrada'}
                    </span>
                  </div>

                  <div className="sm:text-right">
                    {selectedEmpDocsUrl ? (
                      <a
                        href={selectedEmpDocsUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        title={selectedEmpDocsUrl}
                        className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white border border-stone-300 text-slate-800 hover:bg-stone-100 text-xs font-semibold transition"
                      >
                        <Icon name="folder-open" className="w-3.5 h-3.5 text-[#c26d43]" />
                        <span>Docs Habite-se / Entrega</span>
                        <Icon name="external-link" className="w-3 h-3" />
                      </a>
                    ) : (
                      <span className="text-[11px] text-slate-400">
                        Edite na aba Empreendimentos
                      </span>
                    )}
                  </div>
                </div>

                <div className="mt-4 bg-emerald-50/50 rounded-lg p-3.5 border border-emerald-200/80 grid grid-cols-1 sm:grid-cols-12 gap-4 items-start">
                  <div className="sm:col-span-4">
                    <label className="block text-xs font-semibold text-slate-800 mb-1 flex items-center gap-1.5">
                      <Icon name="key-round" className="w-3.5 h-3.5 text-amber-700" />
                      Entrega das Chaves (Unidade)
                    </label>
                    <input
                      type="date"
                      value={formData.dataEntregaChaves}
                      onChange={(e) => handleChange('dataEntregaChaves', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div className="sm:col-span-8">
                    <label className="block text-xs font-semibold text-slate-800 mb-1 flex items-center gap-1.5">
                      <Icon name="file-check-2" className="w-3.5 h-3.5 text-emerald-700" />
                      Link do Termo de Recebimento do Imóvel (Drive)
                    </label>
                    <input
                      type="text"
                      value={formData.linkTermoRecebimento}
                      onChange={(e) => handleChange('linkTermoRecebimento', e.target.value)}
                      placeholder="Cole aqui o link do Termo de Recebimento assinado pelo cliente..."
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                    {normalizedTermoPreview && (
                      <div className="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                        <span className="text-slate-600">Documento vinculado:</span>
                        <a
                          href={normalizedTermoPreview}
                          target="_blank"
                          rel="noopener noreferrer"
                          title={normalizedTermoPreview}
                          className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-emerald-700 text-white font-semibold hover:bg-emerald-800 transition"
                        >
                          <Icon name="file-check-2" className="w-3.5 h-3.5" />
                          <span>{getShortTermoLabel(formData.unidade)}</span>
                          <Icon name="external-link" className="w-3 h-3" />
                        </a>
                      </div>
                    )}
                  </div>
                </div>

                {unitPreviousChamados.length > 0 && (
                  <div className="mt-3 bg-amber-50 border border-amber-200 rounded-lg px-4 py-2.5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 text-xs text-amber-950">
                    <div className="flex items-center gap-2">
                      <Icon name="info" className="w-4 h-4 text-amber-700" />
                      <span>
                        Esta unidade já possui{' '}
                        <strong>
                          {unitPreviousChamados.length}{' '}
                          {unitPreviousChamados.length === 1
                            ? 'chamado anterior registrado'
                            : 'chamados anteriores registrados'}
                        </strong>{' '}
                        neste empreendimento.
                      </span>
                    </div>
                    <button
                      type="button"
                      onClick={() =>
                        onOpenUnitHistory(formData.empreendimento, formData.unidade.trim())
                      }
                      className="inline-flex items-center gap-1.5 font-semibold text-[#b85d32] hover:underline flex-shrink-0"
                    >
                      <Icon name="history" className="w-3.5 h-3.5" />
                      Visualizar Dossiê da Unidade
                    </button>
                  </div>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Nome do Solicitante / Proprietário *
                    </label>
                    <input
                      type="text"
                      value={formData.solicitante}
                      onChange={(e) => handleChange('solicitante', e.target.value)}
                      placeholder="Nome completo do cliente ou síndico"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Telefone / WhatsApp
                    </label>
                    <input
                      type="text"
                      value={formData.telefone}
                      onChange={(e) => handleChange('telefone', e.target.value)}
                      placeholder="(41) 99999-9999"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      E-mail do Cliente
                    </label>
                    <input
                      type="email"
                      value={formData.email}
                      onChange={(e) => handleChange('email', e.target.value)}
                      placeholder="cliente@exemplo.com.br"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>
                </div>

                <div className="mt-4 bg-sky-50/60 p-3.5 rounded-lg border border-sky-200/80">
                  <label className="block text-xs font-semibold text-slate-800 mb-1 flex items-center gap-1.5">
                    <Icon name="folder-open" className="w-3.5 h-3.5 text-sky-700" />
                    Link da Pasta / Fotos (Google Drive)
                  </label>
                  <input
                    type="text"
                    value={formData.linkFotos}
                    onChange={(e) => handleChange('linkFotos', e.target.value)}
                    placeholder="Cole aqui o link da pasta do Google Drive (ex: https://drive.google.com/drive/folders/...)"
                    className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                  />
                  {normalizedPhotoPreview && (
                    <div className="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                      <span className="text-slate-600">Exibição encurtada no sistema e na OS:</span>
                      <a
                        href={normalizedPhotoPreview}
                        target="_blank"
                        rel="noopener noreferrer"
                        title={normalizedPhotoPreview}
                        className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-sky-700 text-white font-semibold hover:bg-sky-800 transition"
                      >
                        <Icon name="camera" className="w-3.5 h-3.5" />
                        <span>{getShortPhotoLabel(formData.protocolo, formData.unidade)}</span>
                        <Icon name="external-link" className="w-3 h-3" />
                      </a>
                    </div>
                  )}
                </div>
              </div>

              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-stone-200 pb-1.5 mb-3">
                  2. Classificação Técnica, Status e Enquadramento de Garantia
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Categoria Técnica
                    </label>
                    <select
                      value={formData.categoria}
                      onChange={(e) => handleChange('categoria', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    >
                      {CATEGORIAS_TECNICAS.map((cat) => (
                        <option key={cat} value={cat}>
                          {cat}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Status do Chamado
                    </label>
                    <select
                      value={formData.status}
                      onChange={(e) => handleChange('status', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg font-medium"
                    >
                      {STATUS_OPCOES.map((st) => (
                        <option key={st} value={st}>
                          {st}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Enquadramento de Garantia (NBR 15575)
                    </label>
                    <select
                      value={formData.enquadramento}
                      onChange={(e) => handleChange('enquadramento', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg font-medium"
                    >
                      {ENQUADRAMENTOS_OPCOES.map((enq) => (
                        <option key={enq} value={enq}>
                          {enq}
                        </option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Técnico / Prestador Designado
                    </label>
                    <input
                      type="text"
                      value={formData.tecnico}
                      onChange={(e) => handleChange('tecnico', e.target.value)}
                      placeholder="Ex: Sérgio (Esquadrias), Eng. Felipe Martins"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>
                </div>
              </div>

              <div>
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-stone-200 pb-1.5 mb-3">
                  3. Agendamento e Vistoria Técnica (Composição da OS)
                </h4>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Data da Vistoria Técnica
                    </label>
                    <input
                      type="date"
                      value={formData.dataVistoria}
                      onChange={(e) => handleChange('dataVistoria', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Horário da Vistoria
                    </label>
                    <input
                      type="time"
                      value={formData.horarioVistoria}
                      onChange={(e) => handleChange('horarioVistoria', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Data Agendada (Execução)
                    </label>
                    <input
                      type="date"
                      value={formData.dataAgendamento}
                      onChange={(e) => handleChange('dataAgendamento', e.target.value)}
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">
                      Horário / Período Execução
                    </label>
                    <input
                      type="text"
                      value={formData.horarioAgendamento}
                      onChange={(e) => handleChange('horarioAgendamento', e.target.value)}
                      placeholder="Ex: 08:30 às 12:00 / Manhã"
                      className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                    />
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                <h4 className="text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-stone-200 pb-1.5">
                  4. Detalhamento Técnico e Ordem de Serviço
                </h4>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Descrição da Solicitação do Cliente *
                  </label>
                  <textarea
                    rows={2}
                    value={formData.descricaoSolicitacao}
                    onChange={(e) => handleChange('descricaoSolicitacao', e.target.value)}
                    placeholder="Descreva o problema relatado pelo proprietário ou condomínio..."
                    className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Parecer Técnico da Engenharia (Fundamentação / Vistoria / NBR 15575)
                  </label>
                  <textarea
                    rows={3}
                    value={formData.parecerTecnico}
                    onChange={(e) => handleChange('parecerTecnico', e.target.value)}
                    placeholder="Registre o diagnóstico técnico da vistoria, causas identificadas e justificativa de procedência ou improcedência..."
                    className="w-full px-3 py-2 text-sm bg-stone-50 border border-stone-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Escopo de Execução / Materiais Necessários (Para Ordem de Serviço)
                  </label>
                  <textarea
                    rows={2}
                    value={formData.escopoExecucao}
                    onChange={(e) => handleChange('escopoExecucao', e.target.value)}
                    placeholder="Descreva os procedimentos de reparo, materiais (ex: PU 40, rejunte, silicone) e recomendações para a equipe técnica..."
                    className="w-full px-3 py-2 text-sm bg-stone-50 border border-stone-300 rounded-lg"
                  />
                </div>
              </div>

              <div className="pt-4 border-t border-stone-200 flex items-center justify-end gap-3">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2.5 rounded-lg border border-stone-300 text-slate-700 text-sm font-medium hover:bg-stone-50"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-6 py-2.5 rounded-lg bg-[#13293d] text-white text-sm font-semibold hover:bg-[#1e3f5a] shadow-sm"
                >
                  Salvar Chamado
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ========================================================================
    // MODAL DE DOSSIÊ / HISTÓRICO CONSOLIDADO POR UNIDADE
    // ========================================================================
    function UnitHistoryModal({
      empreendimento,
      unidade,
      chamados,
      onClose,
      onSelectOS,
      onEditChamado
    }) {
      const unitRecords = useMemo(() => {
        return chamados
          .filter(
            (c) =>
              c.empreendimento?.trim().toLowerCase() === empreendimento.trim().toLowerCase() &&
              c.unidade?.trim().toLowerCase() === unidade.trim().toLowerCase()
          )
          .sort((a, b) => (b.dataAbertura || '').localeCompare(a.dataAbertura || ''));
      }, [chamados, empreendimento, unidade]);

      const stats = useMemo(() => {
        let procedentes = 0;
        let improcedentes = 0;
        let condominio = 0;
        unitRecords.forEach((c) => {
          if (c.enquadramento?.startsWith('Procedente')) procedentes += 1;
          else if (c.enquadramento?.includes('Condomínio')) condominio += 1;
          else improcedentes += 1;
        });
        return {
          total: unitRecords.length,
          procedentes,
          improcedentes,
          condominio
        };
      }, [unitRecords]);

      return (
        <div className="no-print fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-stone-200 my-auto overflow-hidden flex flex-col max-h-[90vh]">
            <div className="bg-[#13293d] text-white px-6 py-4 flex items-center justify-between flex-shrink-0">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-widest text-[#e08b5b] flex items-center gap-1.5">
                  <Icon name="history" className="w-3.5 h-3.5" />
                  Dossiê Técnico Consolidado da Unidade
                </span>
                <h3 className="text-lg font-bold mt-0.5">
                  {empreendimento} • <span className="text-stone-200">{unidade}</span>
                </h3>
              </div>
              <button
                onClick={onClose}
                className="p-2 rounded-lg text-stone-300 hover:bg-white/10 hover:text-white transition"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="bg-stone-50 px-6 py-4 border-b border-stone-200 grid grid-cols-2 sm:grid-cols-4 gap-3 flex-shrink-0">
              <div className="bg-white p-3 rounded-lg border border-stone-200">
                <span className="text-[11px] font-semibold uppercase text-slate-500 block">
                  Total Chamados
                </span>
                <span className="text-xl font-bold text-slate-900">{stats.total}</span>
              </div>
              <div className="bg-white p-3 rounded-lg border border-stone-200">
                <span className="text-[11px] font-semibold uppercase text-teal-700 block">
                  Procedentes (Garantia)
                </span>
                <span className="text-xl font-bold text-teal-800">{stats.procedentes}</span>
              </div>
              <div className="bg-white p-3 rounded-lg border border-stone-200">
                <span className="text-[11px] font-semibold uppercase text-rose-700 block">
                  Improcedentes
                </span>
                <span className="text-xl font-bold text-rose-800">{stats.improcedentes}</span>
              </div>
              <div className="bg-white p-3 rounded-lg border border-stone-200">
                <span className="text-[11px] font-semibold uppercase text-indigo-700 block">
                  Condomínio
                </span>
                <span className="text-xl font-bold text-indigo-800">{stats.condominio}</span>
              </div>
            </div>

            <div className="p-6 overflow-y-auto space-y-4">
              {unitRecords.length === 0 ? (
                <p className="text-sm text-slate-500 text-center py-6">
                  Nenhum registro histórico encontrado para esta unidade.
                </p>
              ) : (
                <div className="relative border-l-2 border-stone-300 ml-3 space-y-5 pl-6">
                  {unitRecords.map((item) => {
                    const normalizedLink = normalizeUrl(item.linkFotos);
                    return (
                      <div
                        key={item.id}
                        className="relative bg-stone-50/80 rounded-xl p-4 border border-stone-200"
                      >
                        <span className="w-3.5 h-3.5 rounded-full bg-[#13293d] border-2 border-white shadow absolute -left-[31px] top-5" />

                        <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="font-mono text-xs font-bold px-2 py-0.5 rounded bg-[#13293d] text-white">
                              {item.protocolo}
                            </span>
                            <span className="text-xs font-semibold text-slate-700">
                              {formatDateBR(item.dataAbertura)}
                            </span>
                            <span className="text-xs text-slate-500">• {item.categoria}</span>
                          </div>
                          <span
                            className={`text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${getStatusBadgeStyle(
                              item.status
                            )}`}
                          >
                            {item.status}
                          </span>
                        </div>

                        <div className="flex flex-wrap items-center gap-2 mb-2">
                          <span
                            className={`text-[11px] font-medium px-2 py-0.5 rounded border ${getEnquadramentoBadgeStyle(
                              item.enquadramento
                            )}`}
                          >
                            {item.enquadramento}
                          </span>
                          {item.solicitante && (
                            <span className="text-xs text-slate-600">
                              Solicitante: <strong>{item.solicitante}</strong>
                            </span>
                          )}
                          {item.email && (
                            <a
                              href={`mailto:${item.email}`}
                              className="inline-flex items-center gap-1 text-xs text-slate-600 hover:text-[#13293d] underline decoration-dotted"
                            >
                              <Icon name="mail" className="w-3 h-3 text-slate-400" />
                              <span>{item.email}</span>
                            </a>
                          )}
                          {item.tecnico && (
                            <span className="text-xs text-slate-600">
                              Responsável: <strong>{item.tecnico}</strong>
                            </span>
                          )}
                        </div>

                        <p className="text-xs text-slate-800 leading-relaxed">
                          <strong>Solicitação:</strong> {item.descricaoSolicitacao}
                        </p>
                        {item.parecerTecnico && (
                          <p className="text-xs text-slate-700 leading-relaxed mt-1.5 bg-white p-2.5 rounded border border-stone-200/80">
                            <strong>Parecer Técnico:</strong> {item.parecerTecnico}
                          </p>
                        )}

                        <div className="mt-3 pt-2.5 border-t border-stone-200/80 flex flex-wrap items-center justify-between gap-2">
                          <div>
                            {normalizedLink ? (
                              <a
                                href={normalizedLink}
                                target="_blank"
                                rel="noopener noreferrer"
                                title={normalizedLink}
                                className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded bg-sky-50 text-sky-800 border border-sky-200 hover:bg-sky-100 text-xs font-semibold transition"
                              >
                                <Icon name="camera" className="w-3.5 h-3.5 text-sky-700" />
                                <span>{getShortPhotoLabel(item.protocolo, item.unidade)}</span>
                                <Icon name="external-link" className="w-3 h-3" />
                              </a>
                            ) : (
                              <span className="text-[11px] text-slate-400">
                                Sem pasta de fotos vinculada
                              </span>
                            )}
                          </div>

                          <div className="flex items-center gap-2">
                            <button
                              type="button"
                              onClick={() => onSelectOS(item)}
                              className="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-[#13293d] text-white text-xs font-medium hover:bg-[#1e3f5a]"
                            >
                              <Icon name="file-text" className="w-3 h-3 text-[#e08b5b]" />
                              Ver OS
                            </button>
                            <button
                              type="button"
                              onClick={() => onEditChamado(item)}
                              className="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-white border border-stone-300 text-slate-700 text-xs font-medium hover:bg-stone-100"
                            >
                              <Icon name="edit-3" className="w-3 h-3" />
                              Editar
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            <div className="px-6 py-3.5 bg-stone-50 border-t border-stone-200 flex justify-end flex-shrink-0">
              <button
                type="button"
                onClick={onClose}
                className="px-5 py-2 rounded-lg bg-[#13293d] text-white text-sm font-medium hover:bg-[#1e3f5a]"
              >
                Fechar Dossiê
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========================================================================
    // MODAL DE EDIÇÃO DO EMPREENDIMENTO
    // ========================================================================
    function EmpreendimentoEditModal({ empreendimento, onClose, onSave }) {
      const [formData, setFormData] = useState({
        id: empreendimento.id,
        nome: empreendimento.nome,
        dataHabiteSe: empreendimento.dataHabiteSe || '',
        dataEntregaCondominio: empreendimento.dataEntregaCondominio || '',
        linkDocumentos: empreendimento.linkDocumentos || ''
      });

      const normalizedDocsPreview = normalizeUrl(formData.linkDocumentos);

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave(formData);
      };

      return (
        <div className="no-print fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-xl w-full shadow-2xl border border-stone-200 overflow-hidden">
            <div className="bg-[#13293d] text-white px-6 py-4 flex items-center justify-between">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-widest text-[#e08b5b]">
                  Cadastro Institucional • Casaalta Construções
                </span>
                <h3 className="text-lg font-bold">{empreendimento.nome}</h3>
              </div>
              <button
                type="button"
                onClick={onClose}
                className="p-2 rounded-lg text-stone-300 hover:bg-white/10 hover:text-white transition"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-6 space-y-4">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Data do Habite-se
                  </label>
                  <input
                    type="date"
                    value={formData.dataHabiteSe}
                    onChange={(e) =>
                      setFormData((prev) => ({ ...prev, dataHabiteSe: e.target.value }))
                    }
                    className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">
                    Data de Entrega do Condomínio
                  </label>
                  <input
                    type="date"
                    value={formData.dataEntregaCondominio}
                    onChange={(e) =>
                      setFormData((prev) => ({ ...prev, dataEntregaCondominio: e.target.value }))
                    }
                    className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                  />
                </div>
              </div>

              <div className="bg-sky-50/60 p-3.5 rounded-lg border border-sky-200/80">
                <label className="block text-xs font-semibold text-slate-800 mb-1 flex items-center gap-1.5">
                  <Icon name="folder-open" className="w-3.5 h-3.5 text-sky-700" />
                  Link da Pasta de Documentos (Habite-se, Ata de Entrega, etc.)
                </label>
                <input
                  type="text"
                  value={formData.linkDocumentos}
                  onChange={(e) =>
                    setFormData((prev) => ({ ...prev, linkDocumentos: e.target.value }))
                  }
                  placeholder="Cole aqui o link da pasta no Google Drive..."
                  className="w-full px-3 py-2 text-sm bg-white border border-stone-300 rounded-lg"
                />
                {normalizedDocsPreview && (
                  <div className="mt-2 flex flex-wrap items-center justify-between gap-2 text-xs">
                    <span className="text-slate-600">Prévia do link salvo:</span>
                    <a
                      href={normalizedDocsPreview}
                      target="_blank"
                      rel="noopener noreferrer"
                      title={normalizedDocsPreview}
                      className="inline-flex items-center gap-1.5 px-3 py-1 rounded-md bg-sky-700 text-white font-semibold hover:bg-sky-800 transition"
                    >
                      <Icon name="folder-open" className="w-3.5 h-3.5" />
                      <span>{getShortEmpDocLabel(formData.nome)}</span>
                      <Icon name="external-link" className="w-3 h-3" />
                    </a>
                  </div>
                )}
              </div>

              <div className="pt-4 border-t border-stone-200 flex justify-end gap-2.5">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 rounded-lg border border-stone-300 text-slate-700 text-sm font-medium hover:bg-stone-50"
                >
                  Cancelar
                </button>
                <button
                  type="submit"
                  className="px-5 py-2 rounded-lg bg-[#13293d] text-white text-sm font-semibold hover:bg-[#1e3f5a]"
                >
                  Salvar Dados do Empreendimento
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
